services:
  api:
    container_name: ${API_CONTAINER}-prod
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./api/.env
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  web:
    container_name: ${WEB_CONTAINER}-prod
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    networks:
      - internal
    depends_on:
      - api

  db:
    image: postgres:16
    container_name: ${DB_CONTAINER}-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
